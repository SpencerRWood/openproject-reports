name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    uses: SpencerRWood/workflows/.github/workflows/release.yml@v1
    permissions:
      contents: write

  container:
    needs: release
    if: ${{ needs.release.outputs.released == 'true' }}
    uses: SpencerRWood/workflows/.github/workflows/container-release.yml@v1
    permissions:
      contents: read
      packages: write
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}

  promotion:
    needs: [release, container]
    if: ${{ needs.release.outputs.released == 'true' && needs.container.result == 'success' && vars.OPENPROJECT_REPORTS_PROMOTION_ENABLED == 'true' }}
    uses: SpencerRWood/workflows/.github/workflows/promote-container-to-dev.yml@v2
    permissions:
      contents: read
    with:
      infrastructure_repository: SpencerRWood/infrastructure
      image_key: openproject_reports_image_ref
      image_name: openproject-reports
      release_tag: ${{ needs.release.outputs.release_tag }}
      image_repository: ${{ needs.container.outputs.image_repository }}
      version_image: ${{ needs.container.outputs.version_image }}
      image_digest: ${{ needs.container.outputs.image_digest }}
      version_image_digest: ${{ needs.container.outputs.version_image_digest }}
    secrets:
      infrastructure_token: ${{ secrets.INFRASTRUCTURE_PR_TOKEN }}
